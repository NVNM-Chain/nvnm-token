# Dependabot cannot follow OpenZeppelin release tags (see .github/dependabot.yml),
# so this reports upstream RELEASES and published advisories instead of SHAs, and
# files an issue rather than an unmergeable PR.
name: Dependency watch

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upstream:
    name: Compare foundry.lock with upstream releases and advisories
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect upstream releases and advisories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          : > report.md

          while read -r path slug; do
            [ -n "$path" ] || continue
            pinned="$(python3 -c 'import json,sys; print(json.load(open("foundry.lock"))[sys.argv[1]]["tag"]["name"])' "$path")"
            latest="$(gh api "repos/$slug/releases/latest" --jq '.tag_name')"
            echo "$path: pinned=$pinned latest=$latest"
            if [ "$pinned" != "$latest" ]; then
              printf -- '- `%s` is pinned at `%s`; upstream released [`%s`](https://github.com/%s/releases/tag/%s).\n' \
                "$path" "$pinned" "$latest" "$slug" "$latest" >> report.md
            fi
          done <<'REPOS'
          lib/forge-std foundry-rs/forge-std
          lib/openzeppelin-contracts OpenZeppelin/openzeppelin-contracts
          REPOS

          since="$(date -u -d '8 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          for slug in foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts; do
            if ! gh api "repos/$slug/security-advisories?per_page=20" > advisories.json 2>/dev/null; then
              echo '[]' > advisories.json
            fi
            jq -r --arg since "$since" --arg slug "$slug" '
              .[] | select(.published_at > $since)
              | "- SECURITY: `\($slug)` [\(.ghsa_id)](\(.html_url)) (\(.severity)) — \(.summary)"' \
              advisories.json >> report.md
          done

          # The CI toolchain is a plain string input to foundry-toolchain, so nothing
          # else in the repo notices when Foundry moves.
          pinned_forge="$(grep -m1 -oE 'version: v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/ci.yml | cut -d' ' -f2)"
          latest_forge="$(gh api repos/foundry-rs/foundry/releases/latest --jq '.tag_name')"
          echo "foundry: pinned=$pinned_forge latest=$latest_forge"
          if [ "$pinned_forge" != "$latest_forge" ]; then
            printf -- '- Foundry is pinned at `%s` in the workflows; upstream released [`%s`](https://github.com/foundry-rs/foundry/releases/tag/%s). Bumping it changes the contract metadata digest — read docs/ and re-run `make release-check`.\n' \
              "$pinned_forge" "$latest_forge" "$latest_forge" >> report.md
          fi

          if [ ! -s report.md ]; then
            echo "foundry.lock and the Foundry pin match the latest upstream releases; no new advisories."
            exit 0
          fi

          {
            echo
            echo "Bump the submodule by hand to the reviewed release tag, update \`foundry.lock\`"
            echo "and run \`make check\`. Never merge an unreleased \`master\` commit."
            echo "See CONTRIBUTING.md."
            echo
            echo "_Generated by \`.github/workflows/dependency-watch.yml\`._"
          } >> report.md

          title='Upstream dependency releases need review'
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi
